# GitHub Action for generating this profile's dynamic README assets:
#
# 1. The contribution graph with a snake eating (and growing on) your
#    contributions. Built from snk's own building blocks (see
#    https://github.com/Platane/snk) instead of its packaged action, so
#    .github/scripts/generate-snake.ts can pad sparse/empty days with
#    invented contributions before the snake's route is computed, and can
#    make the snake grow as it eats. Days you actually contributed on are
#    never touched -- this only affects how lively the animation looks,
#    not your real GitHub contribution graph.
#
# 2. A custom "engineering activity" card (commits/PRs/issues), styled as
#    a CI checks list -- see .github/scripts/generate-activity-card.ts.

name: Generate Snake

# Controls when the action will run. This action runs every 6 hours.

on:
  schedule:
      # every 6 hours
    - cron: "0 */6 * * *"

# This command allows us to run the Action automatically from the Actions tab.
  workflow_dispatch:
    inputs:
      fill_probability:
        description: "Chance (0-1) of inventing a contribution on an empty day"
        required: false
        default: "0.4"

# The sequence of runs in this workflow:
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:

    # Checks repo under $GITHUB_WORKSHOP, so your job can access it
      - uses: actions/checkout@v4

    # Check out snk itself, pinned to a known-good release, so we can call
    # its solver + svg-creator packages directly.
      - uses: actions/checkout@v4
        with:
          repository: Platane/snk
          ref: v3.5.0
          path: snk-src

      - uses: oven-sh/setup-bun@v2

      - name: Install snk dependencies
        working-directory: snk-src
        run: bun install

    # Generates the snake, padding empty days with invented contributions
      - name: Generate snake SVG
        working-directory: snk-src
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNK_USERNAME: pseudoman21
          SNAKE_OUT_SVG: ../dist/github-contribution-grid-snake.svg
          SNAKE_FILL_PROBABILITY: ${{ github.event.inputs.fill_probability || '0.4' }}
        run: |
          cp ../.github/scripts/generate-snake.ts .
          bun generate-snake.ts

    # Generates the engineering-activity card. Non-fatal if the third-party
    # stats source is temporarily down -- the snake shouldn't be blocked by it.
      - name: Generate engineering activity card
        continue-on-error: true
        env:
          SNK_USERNAME: pseudoman21
          CARD_OUT_SVG: dist/engineering-activity.svg
        run: bun .github/scripts/generate-activity-card.ts

     # show the status of the build. Makes it easier for debugging (if there's any issues).
      - run: git status

      # Push the changes
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: master
          force: true

      - uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          # the output branch we mentioned above
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
